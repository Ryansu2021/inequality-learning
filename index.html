<title>門檻：情境不等式</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,800;0,900;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 道路標誌系統。左邊綠色指示牌是「通關路線」，右邊每一關都用同一個框架：任務列 → 步驟條 → 操作區 → 檢查列。
   Color: 路面灰、標誌白、墨黑、指示綠、禁制紅、警告黃、資訊藍、觀光棕。 */
:root{
  --road:#DCDFDB; --road-2:#CDD1CC; --plate:#FFFFFF; --paper:#FBFBF8; --ink:#131416; --ink-2:#4A4E54; --ink-3:#8B9096; --line:#C4C8C3;
  --guide:#0A6A4A; --guide-fg:#FFFFFF; --guide-mut:#B9E2CF; --guide-dim:#2D7E62;
  --reg:#D2231C; --warn:#F5C300; --info:#1D5BAA; --tour:#8B4A1C; --ok:#0B8E59; --ok-bg:#DDF2E7; --no-bg:#FBE3E1; --mid-bg:#FFF4C7;
  --on-warn:#131416; --pole:#131416; --pole-fg:#F4F5F3;
  --f-cn:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Overpass","Highway Gothic","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --road:#16181B; --road-2:#22262A; --plate:#24272C; --paper:#2A2D32; --ink:#EEF0F2; --ink-2:#B4B9C0; --ink-3:#737980; --line:#3A3F45;
  --guide:#0A5A3F; --guide-fg:#F1FFF8; --guide-mut:#9ED3BB; --guide-dim:#1D6E52;
  --reg:#FF4C43; --warn:#FFD21C; --info:#5B97E8; --tour:#CF8650; --ok:#33C98A; --ok-bg:#163A2A; --no-bg:#3E1E1D; --mid-bg:#3A3315;
  --on-warn:#131416; --pole:#0B0C0E; --pole-fg:#EEF0F2; color-scheme:dark }}
:root[data-theme="dark"]{
  --road:#16181B; --road-2:#22262A; --plate:#24272C; --paper:#2A2D32; --ink:#EEF0F2; --ink-2:#B4B9C0; --ink-3:#737980; --line:#3A3F45;
  --guide:#0A5A3F; --guide-fg:#F1FFF8; --guide-mut:#9ED3BB; --guide-dim:#1D6E52;
  --reg:#FF4C43; --warn:#FFD21C; --info:#5B97E8; --tour:#CF8650; --ok:#33C98A; --ok-bg:#163A2A; --no-bg:#3E1E1D; --mid-bg:#3A3315;
  --on-warn:#131416; --pole:#0B0C0E; --pole-fg:#EEF0F2; color-scheme:dark }

html,body{height:100%}
body{background:var(--pole);color:var(--ink);font-family:var(--f-cn);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#vp{position:fixed;inset:0;overflow:hidden;background:var(--pole)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--road);overflow:hidden;display:grid;
  grid-template-columns:372px 1fr;grid-template-rows:72px 1fr;grid-template-areas:"top top" "route work"}
#stage.portrait{grid-template-columns:1fr;grid-template-rows:72px auto 1fr;grid-template-areas:"top" "route" "work"}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- 路標桿 ---------- */
.top{grid-area:top;background:var(--pole);color:var(--pole-fg);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.disc{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 6px #D2231C;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:26px;color:#131416}
.brand b{font-size:29px;font-weight:900;letter-spacing:.14em;line-height:1}
.brand small{display:block;font-size:12.5px;color:#A9AEB4;letter-spacing:.04em;margin-top:5px;font-weight:500}
.overall{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:14px;color:#C9CDD2;font-weight:700}
.overall .bar{display:flex;gap:4px}
.overall .bar i{width:34px;height:10px;border-radius:2px;background:#3D4247}
.overall .bar i.on{background:var(--warn)}
.ibtn{height:40px;min-width:40px;padding:0 12px;border:2px solid #3D4247;border-radius:6px;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.ibtn svg{width:18px;height:18px}
#stage.portrait .tag{display:none}

/* ---------- 通關路線（左） ---------- */
.route{grid-area:route;background:var(--guide);color:var(--guide-fg);margin:16px 0 16px 16px;border-radius:14px;box-shadow:inset 0 0 0 5px var(--guide),inset 0 0 0 8px var(--guide-fg);
  padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
#stage.portrait .route{margin:14px 14px 0;padding:14px 16px}
.route h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--guide-mut)}
#stage.portrait .route h2{display:none}
.legs{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:4px}
.legs::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:6px;background:var(--guide-dim);border-radius:3px}
#stage.portrait .legs{flex-direction:row}
#stage.portrait .legs li{flex:1}
#stage.portrait .legs::before{display:none}
.leg{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:none;border:0;padding:7px 8px 7px 0;border-radius:10px;text-align:left;width:100%}
#stage.portrait .leg{grid-template-columns:1fr;justify-items:center;text-align:center;padding:6px 4px;gap:4px}
.leg .no{width:52px;height:52px;border-radius:8px;background:var(--warn);color:var(--on-warn);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:900;line-height:1;position:relative;z-index:1;box-shadow:0 0 0 4px var(--guide)}
.leg .no small{font-family:var(--f-cn);font-size:10px;font-weight:700;letter-spacing:.1em}
.leg .no span{font-size:24px}
.leg .nm{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
#stage.portrait .leg .nm{justify-content:center;font-size:17px}
.leg .sub{display:block;font-size:13.5px;color:var(--guide-mut);margin-top:1px}
#stage.portrait .leg .sub{display:none}
.leg .dots{display:flex;gap:4px;margin-top:6px}
#stage.portrait .leg .dots{justify-content:center}
.leg .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--guide-mut)}
.leg .dots i.on{background:var(--warn);border-color:var(--warn)}
.leg.on{background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 2px var(--guide-fg)}
.leg.lock{opacity:.45;cursor:not-allowed}
.leg.lock .no{background:var(--guide-dim);color:var(--guide-mut)}
.leg .badge{font-size:11.5px;font-weight:900;background:var(--guide-fg);color:var(--guide);padding:1px 7px;border-radius:3px;letter-spacing:.08em}
.leg svg.lk{width:16px;height:16px}
.take{margin-top:auto;background:var(--plate);color:var(--ink);border-radius:8px;box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px var(--ink);padding:14px 16px;font-size:15px;line-height:1.65;font-weight:700}
.take .cap{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.1em;margin-bottom:4px}
.take .cap::before{content:"";width:13px;height:13px;background:var(--warn);transform:rotate(45deg);box-shadow:0 0 0 1.5px var(--ink)}
.take.locked{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);color:var(--guide-mut);font-weight:500;font-size:14px}
.take.locked .cap{color:var(--guide-mut)}
#stage.portrait .take{display:none}
.teach{background:none;border:0;color:var(--guide-mut);font-size:12.5px;text-decoration:underline;align-self:flex-start;padding:0}
#stage.portrait .teach{align-self:center}

/* ---------- 任務框架（右） ---------- */
.work{grid-area:work;padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;min-width:0;min-height:0;position:relative}
.mission{display:flex;align-items:center;gap:18px;padding:2px 4px 0;min-height:52px}
.mission .ex{flex:none;background:var(--ink);color:var(--plate);border-radius:6px;padding:6px 12px;font-weight:900;font-size:15px;letter-spacing:.06em}
.mission .say{font-size:24px;font-weight:900;line-height:1.4;text-wrap:balance}
.mission .say em{font-style:normal;background:linear-gradient(transparent 60%,var(--warn) 60%)}
.mission .cnt{margin-left:auto;flex:none;text-align:right;font-size:13px;color:var(--ink-2);font-weight:700;line-height:1.4}
.mission .cnt b{display:block;font-family:var(--f-num);font-size:28px;font-weight:900;color:var(--ink);line-height:1}
.steps{display:flex;height:46px}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:0 18px 0 28px;background:var(--road-2);color:var(--ink-3);font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);margin-left:-10px}
.step:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);margin-left:0;padding-left:16px}
.step .n{font-family:var(--f-num);font-weight:900;font-size:19px}
.step.done{background:var(--ink);color:var(--plate)}
.step.cur{background:var(--warn);color:var(--on-warn)}
.stagebox{min-height:0;min-width:0;display:grid;gap:12px}
.plate{background:var(--plate);border-radius:10px;box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px var(--ink);padding:16px 20px;min-width:0;min-height:0;position:relative}
.plate.soft{box-shadow:inset 0 0 0 2px var(--line)}
.ptl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.08em;margin-bottom:6px}
.svgbox{position:relative;min-height:0}
.svgbox > svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
svg text{font-family:var(--f-cn);fill:var(--ink)}
.tk{font-family:var(--f-num);font-size:15px;fill:var(--ink-2);font-weight:600}
.checkbar{display:flex;align-items:center;gap:18px;background:var(--plate);border-radius:10px;padding:12px 14px 12px 20px;min-height:84px;box-shadow:inset 0 0 0 2px var(--line)}
.checkbar .live{font-family:var(--f-num);font-weight:900;font-size:50px;line-height:1;white-space:nowrap;flex:none}
.checkbar .live i{font-style:italic;font-weight:700}
.checkbar .live .q{color:var(--ink-3)}
.msg{flex:1;font-size:16px;line-height:1.6;min-width:0}
.msg small{display:block;color:var(--ink-2);font-weight:500;font-size:14.5px}
.msg.good,.msg .good{color:var(--ok);font-weight:700}
.msg.bad,.msg .bad{color:var(--reg);font-weight:700}
.msg .mid{color:var(--ink);font-weight:700}
.btn{border:0;background:var(--ink);color:var(--plate);border-radius:8px;padding:12px 22px;font-weight:900;font-size:17px;white-space:nowrap}
.btn.go{background:var(--warn);color:var(--on-warn)}
.btn.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-weight:700;font-size:15.5px;padding:9px 16px}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--reg);color:#fff}
.btn:disabled{opacity:.3;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hl{background:linear-gradient(transparent 58%,var(--warn) 58%);padding:0 2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.ripple{animation:ring 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}

/* 出口 1 */
.s1{grid-template-rows:auto 1fr auto}
.sign{display:flex;gap:24px;align-items:center}
.sign .ico{flex:none;width:104px;height:104px}
.sign .txt{font-size:36px;font-weight:900;line-height:1.35;letter-spacing:.02em}
.sign .who{margin-top:4px;font-size:16px;color:var(--ink-2);font-weight:500}
.sign .who b{font-family:var(--f-num);font-style:italic;font-size:21px;color:var(--ink)}
.nlp{display:flex;flex-direction:column;padding:8px 12px}
.nlp .svgbox{flex:1}
.pop{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;gap:6px;background:var(--plate);border-radius:10px;padding:10px;box-shadow:0 0 0 2px var(--ink),0 10px 24px rgba(0,0,0,.18);z-index:3}
.pop p{margin:0 0 2px;font-size:15px;font-weight:900;white-space:nowrap}
.pop button{display:flex;align-items:center;gap:10px;background:var(--road);border:0;border-radius:6px;padding:9px 14px;font-weight:700;font-size:16px;white-space:nowrap}
.pop button:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.pop button i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink)}
.pop button i.f{background:var(--ink)}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wcell{display:flex;align-items:center;gap:10px;border-radius:8px;border:2px dashed var(--line);padding:8px 12px;min-height:54px;background:var(--plate)}
.wcell .sym{font-family:var(--f-num);font-weight:900;font-size:30px;color:var(--ink-3);line-height:1}
.wcell.has{border-style:solid;border-color:var(--ink)}
.wcell.has .sym{color:var(--ink)}
.wcell .ws{display:flex;flex-wrap:wrap;gap:4px}
.wcell .ws span{font-size:13.5px;font-weight:700;background:var(--warn);color:var(--on-warn);padding:1px 7px;border-radius:4px}
.wcell .lb{font-size:12px;color:var(--ink-3);font-weight:700;line-height:1.3}

/* 出口 2 */
.s2{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"given goal" "rail rail" "tray tray"}
.label-tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.label-tbl th{text-align:left;font-weight:900;font-size:17px;border-bottom:6px solid var(--ink);padding:0 0 6px}
.label-tbl td{border-bottom:1.5px solid var(--ink);padding:5px 0}
.label-tbl td.n{text-align:right;font-family:var(--f-num);font-weight:800}
.goal .t{font-size:16px;line-height:1.7}
.goal .unitbig{font-family:var(--f-num);font-weight:900;font-size:42px;margin-top:4px}
.rail{grid-area:rail;display:flex;flex-direction:column;justify-content:center}
.chain{display:flex;align-items:center;gap:14px;min-height:140px;padding:8px 2px 18px}
.frac{display:inline-flex;flex-direction:column;align-items:center;min-width:110px;position:relative;padding:6px 10px;border-radius:8px}
.frac.tile{background:var(--road);box-shadow:inset 0 0 0 2px var(--ink);cursor:pointer}
.frac .t,.frac .b{font-family:var(--f-num);font-weight:800;font-size:30px;white-space:nowrap;padding:2px 6px}
.frac .bar{height:3px;background:var(--ink);align-self:stretch;margin:2px 0}
.frac u{text-decoration:none;font-family:var(--f-cn);font-size:20px;font-weight:700;margin-left:4px;position:relative}
.frac u.x{color:var(--ink-3)}
.frac u.x::after{content:"";position:absolute;left:-3px;right:-3px;top:52%;height:3px;background:var(--reg);transform:rotate(-14deg)}
.frac .rm{position:absolute;right:-9px;top:-9px;width:24px;height:24px;border-radius:50%;border:0;background:var(--reg);color:#fff;font-size:13px;line-height:24px;padding:0}
.frac .flip{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--ink);color:var(--plate);border-radius:10px;padding:1px 9px;white-space:nowrap}
.op{font-family:var(--f-num);font-weight:900;font-size:34px;color:var(--ink-3)}
.res{font-family:var(--f-num);font-weight:900;font-size:40px;white-space:nowrap}
.res span{font-family:var(--f-cn);font-size:22px}
.slot{min-width:120px;height:104px;border:2px dashed var(--ink-3);border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:14px;font-weight:700;text-align:center;padding:6px}
.tray{grid-area:tray}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tilebtn{background:var(--road);border:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--ink);padding:10px 16px;font-family:var(--f-num);font-weight:800;font-size:20px}
.tilebtn small{font-family:var(--f-cn);font-weight:700}
.tilebtn:disabled{opacity:.3}

/* 出口 3 */
.s3{grid-template-columns:1fr 380px}
.g3{display:flex;flex-direction:column}
.g3 .svgbox{flex:1}
.bill{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.billrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.billrow .nm{font-weight:900;font-size:16px}
.billrow .nm small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.billrow .tot{font-family:var(--f-num);font-weight:900;font-size:30px}
.bar2{grid-column:1/3;height:24px;display:flex;border-radius:4px;overflow:hidden;background:var(--road)}
.bar2 .fx{background-image:repeating-linear-gradient(45deg,currentColor 0 3px,transparent 3px 8px);opacity:.75}
.bar2 .vr{background:currentColor}
.gapbox{font-size:15px;line-height:1.7;border-top:2px solid var(--ink);padding-top:10px}
.mathl{font-family:var(--f-num);font-weight:800;font-size:21px;line-height:1.5}
.mathl i{font-style:italic;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .lbl{font-weight:900;font-size:16px}

.s3.withmap{grid-template-rows:1fr 150px}
.s3.withmap .map{grid-column:1/3;display:flex;flex-direction:column}
.map .svgbox{flex:1}
.cust{display:flex;flex-direction:column;gap:12px;justify-content:center}
.cust .who3{font-size:30px;font-weight:900}
.cust .cx{font-weight:900;font-size:64px;line-height:1}
.cust .cx small{font-family:var(--f-cn);font-size:20px;color:var(--ink-2)}
#stage.portrait .s3.withmap{grid-template-columns:1fr;grid-template-rows:auto auto 200px}
#stage.portrait .s3.withmap .map{grid-column:1}
.crow{display:grid;grid-template-columns:32px 92px auto auto auto 1fr;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;font-size:18px}
.crow .cn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;background:var(--road-2);color:var(--ink-3)}
.crow .cl{font-weight:900}.crow .ce{font-family:var(--f-num);font-weight:800;font-size:22px;white-space:nowrap}
.crow .cv{font-family:var(--f-num);font-size:26px;color:var(--ok)}.crow .cq{font-family:var(--f-num);font-size:24px;color:var(--ink-3)}.crow .cu{font-size:15px;color:var(--ink-2)}
.crow.cur{background:var(--mid-bg);box-shadow:inset 0 0 0 2.5px var(--warn)}.crow.cur .cn{background:var(--warn);color:var(--on-warn)}
.crow.ok .cn{background:var(--ok);color:#fff}.crow.wait{opacity:.45}
.crow:last-child{grid-template-columns:32px 92px auto auto auto 1fr}
.cin{width:120px;font-size:24px;font-weight:900;padding:6px 10px;border-radius:8px;border:2.5px solid var(--ink);background:var(--plate);color:var(--ink)}
.cust{gap:8px!important;justify-content:flex-start!important}
.sit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--road);border-radius:10px;padding:12px 16px;font-size:17px;line-height:1.7;margin-bottom:4px}
.sit .sitag{background:var(--ink);color:var(--plate);border-radius:5px;padding:2px 9px;font-weight:900;font-size:13px;margin-top:4px}
.sit b{font-family:var(--f-num);font-weight:900}
.sit strong{font-weight:900}
.sit .big{font-size:26px;font-weight:900;padding:0 2px}
.ctab{border-collapse:collapse;width:100%;font-size:16px}
.ctab th,.ctab td{padding:6px 10px;border-bottom:1.5px solid var(--line);text-align:center}
.ctab th{font-size:13px;color:var(--ink-2)}
.ctab td.num{font-family:var(--f-num);font-weight:800;font-size:18px}
.ctab tr.hit td{background:var(--mid-bg)}
.ctip{font-size:14.5px;color:var(--ink-2)}
/* 出口 4 */
@keyframes glow2{0%,100%{box-shadow:0 0 0 4px var(--warn),0 0 18px 4px rgba(245,195,0,.55)}50%{box-shadow:0 0 0 4px var(--warn),0 0 4px 0 rgba(245,195,0,.2)}}
.sheet.focus2{animation:glow2 1.6s ease-in-out infinite}
.hint5{display:flex;flex-direction:column;gap:12px}

/* ================= 縮放 ================= */
const stage=$('#stage'); let portrait=null;
function fit(){
  const W=innerWidth,H=innerHeight,p=W/H<0.9;
  if(p!==portrait){portrait=p; stage.classList.toggle('portrait',p);}
  const bw=p?900:1600, bh=p?1600:900; stage.style.width=bw+'px'; stage.style.height=bh+'px';
  const s=Math.min(W/bw,H/bh); stage.style.transform=`translate(${(W-bw*s)/2}px,${(H-bh*s)/2}px) scale(${s})`;
  render();
}
addEventListener('resize',fit);

/* ================= 左：通關路線 ================= */
const LOCK='<svg class="lk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>';
function renderRoute(){
  const legs=LEGS.map((l,i)=>{const lk=!unlocked(i), n=Math.min(prog(i),l.need);
    return `<li><button class="leg${i===S.ex?' on':''}${lk?' lock':''}" data-act="ex" data-v="${i}" ${lk?'aria-disabled="true" title="先通過前一個出口"':''}>
      <span class="no"><small>出口</small><span>${i+1}</span></span>
      <span><span class="nm">${l.t}${S.passed[i]?'<span class="badge">通過</span>':''}${lk?LOCK:''}</span><span class="sub">${l.sub}</span>
      <span class="dots">${Array.from({length:l.need},(_,k)=>`<i class="${k<n?'on':''}"></i>`).join('')}</span></span></button></li>`;}).join('');
  const T=S.t, tn=T.done?TEST.filter((q,k)=>T.ans[k]===q.a).length:T.ans.length;
  const tleg=`<li><button class="leg tst${S.ex===5?' on':''}" data-act="ex" data-v="5"><span class="no"><span>評</span></span>
      <span><span class="nm">評量${T.done?`<span class="badge">${tn} / ${TEST.length}</span>`:''}</span><span class="sub">${TEST.length} 題，不給提示，做完看結果</span>
      <span class="dots">${TEST.map((q,k)=>`<i class="${T.done?(T.ans[k]===q.a?'on':''):(k<T.ans.length?'on':'')}"></i>`).join('')}</span></span></button></li>`;
  const L=LEGS[S.ex];
  const take=S.ex===5?`<div class="take"><div class="cap">評量怎麼做</div>每一題都自己來：圈出問的量、畫出條件語詞、對齊單位、找一樣多、往解的一側取整。交卷後才看對錯。</div>`
    :`<div class="take${S.passed[S.ex]?'':' locked'}"><div class="cap">出口 ${S.ex+1} 帶走一句</div>${S.passed[S.ex]?L.take:`完成 ${L.need} ${L.unit}後出現。建議照 1 → 5 的順序走。`}</div>`;

   <div class="steps">${steps.map((s,i)=>`<div class="step ${i<cur?'done':i===cur?'cur':''}"><span class="n">${i<cur?'✓':i+1}</span>${s}</div>`).join('')}</div>

/* ================= 共用數線 ================= */
function axis(svg,o){
  const [W,H]=prep(svg); const L=46,R=46,y=o.y||H*0.62; const X=v=>L+(v-o.min)/(o.max-o.min)*(W-L-R);
  const g=el('g',{},svg);
  el('line',{x1:L-26,x2:W-R+26,y1:y,y2:y,stroke:'var(--ink)','stroke-width':3,'stroke-linecap':'round'},g);
  for(let v=Math.ceil(o.min/o.tk-1e-9)*o.tk; v<=o.max+1e-9; v=r6(v+o.tk)){
    const major=Math.abs(v/o.lb-Math.round(v/o.lb))<1e-9;
    el('line',{x1:X(v),x2:X(v),y1:y-(major?11:6),y2:y+(major?11:6),stroke:'var(--ink)','stroke-width':major?2.2:1.4},g);
    if(major) el('text',{x:X(v),y:y+38,'text-anchor':'middle',class:'tk'},g,fmt(v));
  }
  return {X,y,W,H,g,L,R,svg};
}
function ray(A,b,sym,col,opts={}){
  const {X,y,W,L,R,g,svg}=A; const dir=(sym==='≥'||sym==='>')?1:-1, inc=(sym==='≥'||sym==='≤'); const lift=opts.lift||30;
  const x0=X(b), x1=opts.toX!=null?opts.toX:(dir>0?W-R+20:L-20), yy=y-lift;
  const id='m'+Math.random().toString(36).slice(2,8); const defs=el('defs',{},svg);
  const mk=el('marker',{id,viewBox:'0 0 10 10',refX:5,refY:5,markerWidth:4,markerHeight:4,orient:'auto-start-reverse'},defs); el('path',{d:'M0 0L10 5L0 10z',fill:col},mk);
  if(!opts.noband) el('rect',{x:Math.min(x0,x1),y:yy-2,width:Math.abs(x1-x0),height:lift+28,fill:col,opacity:.12},g);
  el('line',{x1:x0,x2:x1,y1:yy,y2:yy,stroke:col,'stroke-width':opts.w||9,'stroke-dasharray':opts.dash||'','marker-end':`url(#${id})`},g);
  el('line',{x1:x0,x2:x0,y1:yy,y2:y,stroke:col,'stroke-width':3,'stroke-dasharray':opts.dash||''},g);
  if(!opts.noring) el('circle',{cx:x0,cy:yy,r:16,fill:inc?col:'var(--plate)',stroke:col,'stroke-width':4.5},g);
}

function card(){return S.w.deck[S.w.i%S.w.deck.length];}

    `圓圈現在是<em>${w.inc?'實心（算進去）':'空心（不算）'}</em>。要改再點一次；確定了就<em>往左或往右拉</em>。`,

    <div class="words">${cells.map(([s,lb])=>`<div class="wcell${w.cells[s].length?' has':''}"><span class="sym">${s}</span>${w.cells[s].length?`<span class="ws">${w.cells[s].map(x=>`<span>${x}</span>`).join('')}</span>`:`<span class="lb">${lb}<br>還沒收集</span>`}</div>`).join('')}</div>
  </div>`;
  return frame(say,['讀句子','決定圓圈：算就點，不算不點','往左或往右拉','檢查'],cur,stageH,check,cnt(0));

function d1(){
  const svg=$('#nl1'); if(!svg) return; const w=S.w,c=card();

      up:(sv,ev)=>{const [qx]=toVB(sv,ev); const moved=Math.abs(qx-sx)>6; w.drag=null;

function w1Check(){
  const w=S.w,c=card(),sym=SYM(w.dir,w.inc);
  if(sym===c.a){ w.res='ok'; w.ok++; if(!w.cells[sym].includes(c.w)) w.cells[sym].push(c.w); checkPass(0); return; }
  const wantDir=/≥|>/.test(c.a)?'>':'<', wantInc=/≥|≤/.test(c.a); const m=[];
  if(w.dir!==wantDir) m.push(`方向不對：${c.who}比 ${fmt(c.n)} ${wantDir==='>'?'大':'小'}。`);
  if(w.inc!==wantInc) m.push(`圓圈不對：「${c.w}」${wantInc?'包含':'不包含'}剛好 ${fmt(c.n)}，${wantInc?'要點圓圈變實心':'不該點圓圈，要保持空心'}。`);
  w.res=m.join(' ');
}

/* ================= 出口 2：單位 ================= */
function fracOf(t,f){return f?{t:t[1],b:t[0]}:{t:t[0],b:t[1]};}
function tally(sc,chain){
  const parts=[{t:sc.start.t,b:sc.start.b},...chain.map(c=>fracOf(sc.tiles[c.i],c.f))];
  const cnt={}; let val=1; parts.forEach(p=>{p.t[1].forEach(u=>cnt[u]=(cnt[u]||0)+1); p.b[1].forEach(u=>cnt[u]=(cnt[u]||0)-1); val*=p.t[0]/p.b[0];});
  const num={},den={}; parts.forEach(p=>{p.t[1].forEach(u=>num[u]=(num[u]||0)+1); p.b[1].forEach(u=>den[u]=(den[u]||0)+1);});
  const lN={},lD={}; for(const u in num) lN[u]=Math.min(num[u],den[u]||0); for(const u in den) lD[u]=Math.min(den[u],num[u]||0);
  const marks=parts.map(p=>({t:p.t[1].map(u=>{const x=lN[u]>0; if(x) lN[u]--; return [u,x];}),b:p.b[1].map(u=>{const x=lD[u]>0; if(x) lD[u]--; return [u,x];})}));
  const rem=Object.entries(cnt).filter(([k,v])=>v!==0); const tg={}; sc.tgt.n.forEach(x=>tg[x]=(tg[x]||0)+1); sc.tgt.d.forEach(x=>tg[x]=(tg[x]||0)-1);
  const ok=rem.length===Object.keys(tg).length&&rem.every(([k,v])=>tg[k]===v);
  const nm=(k,v)=>(UNM[k]||k)+(Math.abs(v)>1?'²':'');
  const rN=rem.filter(([k,v])=>v>0).map(([k,v])=>nm(k,v)).join('‧')||'1', rD=rem.filter(([k,v])=>v<0).map(([k,v])=>nm(k,v)).join('‧');
  return {parts,marks,val,ok,now:rD?`${rN} / ${rD}`:rN};
}
const uStr=l=>l.map(([u,x])=>`<u class="${x?'x':''}">${UNM[u]||u}</u>`).join('<u>‧</u>');
function v2(){
  const u=S.u, sc=UNITSC[u.sc], chain=u.chain[sc.k], T=tally(sc,chain);
  const cur=u.res==='ok'?4:chain.length===0?1:T.ok?3:2;

  const fr=(p,m,i)=>(i===0&&p.b[0]===1&&!p.b[1].length)?`<div class="frac"><div class="t num">${fmt(p.t[0])}${uStr(m.t)}</div></div>`:
    `<div class="frac ${i?'tile':''}" ${i?`data-act="u-flip" data-v="${i-1}"`:''}><div class="t num">${fmt(p.t[0])}${uStr(m.t)}</div><div class="bar"></div><div class="b num">${fmt(p.b[0])}${uStr(m.b)}</div>${i?`<button class="rm" data-act="u-rm" data-v="${i-1}" aria-label="移除">✕</button><span class="flip">點我翻轉</span>`:''}</div>`;

function speak(text,done,k){
  if(DEMO_AUDIO[k]&&VOICE_ON){ try{ if(AUD){AUD.pause();} AUD=new Audio(DEMO_AUDIO[k]); let fired=false; const fin=()=>{ if(fired) return; fired=true; done&&done(); };
      AUD.onended=fin; AUD.onerror=fin; setTimeout(fin,20000); const pr=AUD.play(); if(pr&&pr.catch) pr.catch(()=>setTimeout(fin,Math.max(2200,text.length*170))); return; }catch(e){} }
  if(DEMO_AUDIO.length&&!VOICE_ON){ done&&setTimeout(done,Math.max(2200,text.length*170)); return; }
  if(!TTS||!VOICE_ON||!VOICE){ done&&setTimeout(done,Math.max(2200,text.length*170)); return; }
  try{ TTS.cancel(); const u=new SpeechSynthesisUtterance(text); u.voice=VOICE; u.lang=VOICE.lang||'zh-TW'; u.rate=1; u.pitch=1.05;
    let fired=false; const fin=()=>{ if(fired) return; fired=true; done&&done(); }; u.onend=fin; u.onerror=fin;
    setTimeout(fin, text.length*400+4000); TTS.speak(u); }catch(e){ done&&setTimeout(done,2500); } }

function closeDemo(){ hush(); const d=$('#demo'); if(d) d.remove(); if(DM) DM.tok++; DM=null; }
function demoClick(e){ const b=e.target.closest('[data-dm]'); if(!b) return; const a=b.dataset.dm;

  if(a==='voice'){ VOICE_ON=!VOICE_ON; b.textContent=VOICE_ON?'配音：開':'配音：關'; if(!VOICE_ON) hush(); return; }
  if(a==='play'){ DM.playing=!DM.playing; if(DM.playing){ playStep(DM.done?(DM.k>=DEMO.length-1?0:DM.k+1):DM.k); } else { DM.tok++; hush(); syncCtl(); } }

function playStep(k){
  if(!DM) return; hush(); const tok=++DM.tok; DM.k=k; DM.done=false; const d=DEMO[k]; let st=demoState(k);
  const draw=()=>{ $('#dstage').innerHTML=demoStage(st); if(d.hl&&!d.tgt) $('#dstage').querySelector(d.hl)?.classList.add('dhl'); };
  draw(); $('#dcap').innerHTML=`<b>${k+1} / ${DEMO.length}</b><span>${d.cap}</span>`; syncCtl(); const old=$('#dv .dend'); if(old) old.remove();
  let spoke=false, acted=!d.tgt; const t0=Date.now();
  const next=()=>{ if(tok!==DM?.tok||!spoke||!acted) return; DM.done=true;
    if(DM.playing){ const wait=Math.max(500,2600-(Date.now()-t0));
      if(k<DEMO.length-1) setTimeout(()=>{ if(tok===DM?.tok&&DM.playing) playStep(k+1); },wait);
      else { DM.playing=false; syncCtl(); const e=document.createElement('div'); e.className='dend'; e.innerHTML='<div class="dendbox"><div class="dendt">影片播完了</div><div class="row"><button class="dgo" data-dm="close">我會了，關閉影片開始做</button><button class="drep" data-dm="replay">⟲ 再看一次</button></div></div>'; $('#dv').appendChild(e);} } };

  if(d.tgt){ moveCursor(d.tgt); setTimeout(()=>{ if(tok!==DM?.tok) return; clickFx(); d.act(st.chain,st); draw(); moveCursor(d.tgt); acted=true; next(); },1800); }

}

/* ================= 評量 ================= */
function v6(){
  const T=S.t, N=TEST.length, steps=TEST.map((q,k)=>`第 ${k+1} 題`);
  if(!T.done){ const Q=TEST[T.i];
    const MK=['','m-ask','m-cond','m-unit'];
    const sheet=`<div class="sheet"><div class="qno"><span>${T.i+1}</span>${Q.title}</div><div class="passage tapping">${tChunks(Q.q).map((t,j)=>`<span class="chunk ${MK[T.marks[T.i+':'+j]||0]}" data-act="t-tap" data-v="${j}" role="button" tabindex="0">${t}</span>`).join('')}</div>
      <div class="tmk">可以自己在題目上做記號：點一下 <b style="color:var(--reg)">紅圈</b>（問的量）→ 再點 <b style="color:var(--info)">藍底線</b>（條件語詞）→ 再點 <b style="color:var(--tour)">框</b>（有單位的數）→ 再點清除。<br><button class="wtool" data-act="wb">✎ 打開白板算一算</button></div></div>`;
    const side=`<div class="plate side5 focus"><div class="ptl">第 ${T.i+1} 題・選一個答案</div><div class="opts">${Q.opts.map((o,j)=>`<button class="opt ${T.pick===j?'sel':''}" data-act="t-pick" data-v="${j}">(${'ABCD'[j]}) ${o}</button>`).join('')}</div></div>`;
    const msg=T.pick==null?'<small>評量不給提示，也不會馬上告訴你對錯。選好之後按確定。</small>':`<span class="mid">你選了 (${'ABCD'[T.pick]})。確定就按右邊；想改可以再點別的選項。</span>`;
    const btn=`<button class="btn go" data-act="t-next" ${T.pick==null?'disabled':''}>${T.i<N-1?'確定，下一題 ▸':'確定，交卷看結果 ▸'}</button>`;
    return frame(`第 ${T.i+1} 題：<em>自己讀題</em>，圈、畫、對齊，再選答案。`,steps,T.i,`<div class="stagebox s5 s6">${sheet}${side}</div>`,`<div class="msg">${msg}</div>${btn}`,`已作答<b>${T.ans.length} / ${N}</b>`);
  }
  const ok=k=>T.ans[k]===TEST[k].a, sc=TEST.filter((q,k)=>ok(k)).length;
  const sk=LEGS.map((L,e)=>{ const ks=TEST.map((q,k)=>k).filter(k=>TEST[k].ex===e), g=ks.filter(ok).length, full=g===ks.length;
    return `<div class="sk"><span>出口 ${e+1}・${L.t}</span><span class="bar2"><i class="${full?'':'lo'}" style="width:${ks.length?g/ks.length*100:0}%"></i></span><span class="n">${g} / ${ks.length}</span>${full?'<span style="color:var(--ok);font-size:14px">✓ 掌握了</span>':`<button class="btn" data-act="ex" data-v="${e}">回出口 ${e+1} 再練</button>`}</div>`; }).join('');
  const comment=sc===N?'全對！四個動作都用上了。':sc>=N-2?'大部分都會了，看看錯的那幾題卡在哪一步。':'先看錯的題目解析，再回建議的出口練一練。';
  const left=`<div class="plate"><div class="ptl">評量結果</div><div class="score"><b>${sc}</b><span>/ ${N} 題答對</span></div><div style="font-size:18px;font-weight:900;margin:6px 0 12px">${comment}</div>${sk}</div>`;
  const V=TEST[T.view];
  const right=`<div class="plate side5"><div class="ptl">逐題檢討・點題目看解析</div><div class="rv">${TEST.map((q,k)=>`<button class="${k===T.view?'on':''}" data-act="t-view" data-v="${k}"><b class="${ok(k)?'y':'x'}">${ok(k)?'✓':'✗'}</b><span>${k+1}. ${q.title}</span></button>`).join('')}</div>
    <div class="why6"><span class="yo">第 ${T.view+1} 題：你選 (${'ABCD'[T.ans[T.view]]}) ${TEST[T.view].opts[T.ans[T.view]]}${ok(T.view)?'　✓':`　→ 正確是 (${'ABCD'[V.a]}) ${V.opts[V.a]}`}</span>${V.why}</div></div>`;
  const end=T.ended?`<div class="pass"><div class="passcard"><div class="stamp">練習結束</div><div class="tk2">評量答對 ${sc} / ${N} 題。下次在紙上看到情境不等式，照這個順序讀：</div>
    <ol><li>圈出問的量，設 x，寫單位</li><li>畫出條件語詞，決定方向和邊界</li><li>把單位對齊</li><li>比較兩個方案時先找一樣多</li><li>往解的一側取整，回到情境作答</li></ol>
    <div class="row"><button class="btn alt" data-act="t-back">回去看檢討</button><button class="btn go" data-act="restart">從頭再玩</button></div></div></div>`:'';
  return frame(`評量完成：<em>答對 ${sc} / ${N} 題</em>。點右邊的題目看解析。`,steps,N,`<div class="stagebox s5" style="grid-template-columns:1fr 470px">${left}${right}</div>`,
    `<div class="msg"><small>錯的題目，左邊會建議回哪一個出口再練。</small></div><button class="btn alt" data-act="t-redo">再測一次</button><button class="btn go" data-act="t-end">結束</button>`,`答對<b>${sc} / ${N}</b>`)+end;
}

/* ================= render ================= */
function render(){
  renderRoute();
  $('#work').innerHTML=[v1,v2,v3,v4,v5,v6][S.ex]()+(S.ex<5&&S.popPass&&S.passed[S.ex]?passHTML():'');
  [d1,()=>{},d3,d4,()=>{},()=>{}][S.ex]();
}
fit();
document.fonts&&document.fonts.ready.then(()=>render());
})();

<style>
.ibtn.wbon{background:#F5C300;border-color:#F5C300;color:#131416}
.wb-overlay{position:fixed;inset:0;z-index:9000}
.wb-overlay[hidden]{display:none}
#wbCanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair;background:transparent}
.wb-overlay.wb-opaque #wbCanvas{background:#fff}
.wb-overlay.wb-grid #wbCanvas{background-image:linear-gradient(rgba(29,91,170,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(29,91,170,.13) 1px,transparent 1px);background-size:32px 32px}
.wb-overlay.wb-opaque.wb-grid #wbCanvas{background-color:#fff}
.wb-overlay.erasing #wbCanvas{cursor:cell}
.wb-bar{box-sizing:border-box;width:max-content;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#131416;color:#fff;border-radius:12px;padding:8px 12px 8px 8px;box-shadow:0 0 0 2px #F5C300,0 10px 30px rgba(0,0,0,.35);font:700 14px "Noto Sans TC",system-ui,sans-serif;resize:both;overflow:auto;min-width:260px;min-height:52px;max-width:96vw;max-height:60vh;user-select:none}
.wb-bar .grip{cursor:grab;font-size:20px;padding:4px 6px;color:#9AA0A6;touch-action:none}
.wb-bar .sep{width:1px;align-self:stretch;background:#3D4247;margin:0 2px}
.wb-bar button{height:36px;min-width:36px;padding:0 10px;border:2px solid #3D4247;border-radius:7px;background:none;color:#fff;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.wb-bar button:hover{border-color:#fff}
.wb-bar button.active{background:#F5C300;border-color:#F5C300;color:#131416}
.wb-bar .sw{width:30px;height:30px;min-width:30px;padding:0;border-radius:50%;border:3px solid #131416;box-shadow:0 0 0 2px #3D4247}
.wb-bar .sw.active{box-shadow:0 0 0 3px #F5C300;background-clip:padding-box}
.wb-bar input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.wb-bar input[type=range]{width:90px;accent-color:#F5C300}
.wb-bar .wv{font-family:Overpass,monospace;min-width:22px;text-align:right}
.wb-bar .close{border-color:#D2231C}
.wb-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#F5C300;color:#131416;font:900 14px "Noto Sans TC",sans-serif;padding:5px 14px;border-radius:999px;pointer-events:none;opacity:.92}
.wtool{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;background:var(--ink);color:var(--plate);border-radius:999px;padding:7px 14px;font-weight:900;font-size:14.5px}
</style>
<div class="wb-overlay" id="wbOverlay" hidden>
  <canvas id="wbCanvas"></canvas>
  <div class="wb-bar" id="wbBar">
    <span class="grip" id="wbGrip" title="拖曳移動工具列">⠿</span>
    <button class="sw" data-c="#131416" style="background:#131416" title="黑"></button>
    <button class="sw" data-c="#D2231C" style="background:#D2231C" title="紅"></button>
    <button class="sw" data-c="#1D5BAA" style="background:#1D5BAA" title="藍"></button>
    <button class="sw" data-c="#0B8E59" style="background:#0B8E59" title="綠"></button>
    <input type="color" id="wbColor" value="#D2231C" title="自訂顏色">
    <span class="sep"></span>
    <span>粗細</span><input type="range" id="wbWidth" min="1" max="40" value="4"><span class="wv" id="wbWv">4</span>
    <span class="sep"></span>
    <button id="wbEraser" title="橡皮擦（用同一個粗細）">橡皮擦</button>
    <button id="wbClear" title="全部清除">清除</button>
    <button id="wbOpaque" title="切換透明 / 白底">白底</button>
    <button id="wbGridBtn" title="方格紙">方格</button>
    <span class="sep"></span>
    <button id="wbSaveLayer" title="只存筆跡（透明背景）">存筆跡</button>
    <button id="wbSaveMerged" title="網頁畫面＋筆跡">存畫面</button>
    <button class="close" id="wbClose">✕ 關閉白板</button>
  </div>
</div>
<script>
(()=>{
const ov=document.getElementById('wbOverlay'), canvas=document.getElementById('wbCanvas'), ctx=canvas.getContext('2d'), bar=document.getElementById('wbBar');
const tog=document.getElementById('wbToggleBtn');
let renderScale=Math.min(window.devicePixelRatio||1,2), ready=false, drawing=false, lastX=0, lastY=0, color='#D2231C', width=4, eraser=false;
function init(){ if(ready) return; const w=innerWidth,h=innerHeight; canvas.width=Math.round(w*renderScale); canvas.height=Math.round(h*renderScale); canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(renderScale,0,0,renderScale,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ready=true; }
function open(on){ if(on){ init(); ov.hidden=false; } else ov.hidden=true; tog.classList.toggle('wbon',on); tog.lastChild.textContent=on?' 關閉白板':' 白板'; }
window.wbToggle=()=>open(ov.hidden);
tog.addEventListener('click',e=>{e.stopPropagation(); window.wbToggle();});
document.getElementById('wbClose').onclick=()=>open(false);
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!ov.hidden) open(false); });
function mode(){ ctx.globalCompositeOperation=eraser?'destination-out':'source-over'; ctx.strokeStyle=color; ctx.lineWidth=eraser?width*3:width; }
function pos(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(innerWidth/r.width), y:(e.clientY-r.top)*(innerHeight/r.height)}; }
canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing=true; const p=pos(e); lastX=p.x; lastY=p.y; mode(); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+.01,p.y+.01); ctx.stroke(); });
canvas.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; });
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>drawing=false));
const sws=[...bar.querySelectorAll('.sw')], cin=document.getElementById('wbColor'), eb=document.getElementById('wbEraser');
function setEraser(on){ eraser=on; eb.classList.toggle('active',on); ov.classList.toggle('erasing',on); }
function setColor(c){ color=c; cin.value=c; sws.forEach(b=>b.classList.toggle('active',b.dataset.c.toLowerCase()===c.toLowerCase())); setEraser(false); }
sws.forEach(b=>b.onclick=()=>setColor(b.dataset.c)); cin.oninput=()=>setColor(cin.value); setColor(color);
const wr=document.getElementById('wbWidth'), wv=document.getElementById('wbWv'); wr.oninput=()=>{ width=+wr.value; wv.textContent=wr.value; };
eb.onclick=()=>setEraser(!eraser);
document.getElementById('wbClear').onclick=()=>{ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); };
const ob=document.getElementById('wbOpaque'); ob.onclick=()=>ob.classList.toggle('active',ov.classList.toggle('wb-opaque'));
const gb=document.getElementById('wbGridBtn'); gb.onclick=()=>gb.classList.toggle('active',ov.classList.toggle('wb-grid'));
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;};
function dl(cv,name){ cv.toBlob(b=>{ const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); },'image/png'); }
document.getElementById('wbSaveLayer').onclick=()=>dl(canvas,`門檻_白板筆跡_${stamp()}.png`);
const sm=document.getElementById('wbSaveMerged');
sm.onclick=()=>{ if(typeof html2canvas!=='function') return; sm.disabled=true; const s=1;
  html2canvas(document.body,{scale:s,backgroundColor:getComputedStyle(document.body).backgroundColor||'#fff',logging:false,width:innerWidth,height:innerHeight,ignoreElements:el=>el.id==='wbOverlay'})
  .then(bg=>{ const m=document.createElement('canvas'); m.width=bg.width; m.height=bg.height; const mc=m.getContext('2d'); mc.drawImage(bg,0,0);
    if(ov.classList.contains('wb-opaque')){ mc.fillStyle='#fff'; mc.fillRect(0,0,m.width,m.height); }
    mc.drawImage(canvas,0,0,canvas.width,canvas.height,Math.round(scrollX*s),Math.round(scrollY*s),Math.round(innerWidth*s),Math.round(innerHeight*s));
    dl(m,`門檻_白板畫面_${stamp()}.png`); }).finally(()=>sm.disabled=false); };
// 拖曳工具列
const grip=document.getElementById('wbGrip');
grip.addEventListener('pointerdown',e=>{ e.preventDefault(); grip.setPointerCapture(e.pointerId); const sx=e.clientX, sy=e.clientY, r=bar.getBoundingClientRect(); let pinned=false;
  const mv=ev=>{ const dx=ev.clientX-sx, dy=ev.clientY-sy; if(!pinned&&(Math.abs(dx)>3||Math.abs(dy)>3)){ bar.style.width=r.width+'px'; bar.style.height=r.height+'px'; pinned=true; } if(!pinned) return;
    bar.style.left=Math.max(0,Math.min(r.left+dx,innerWidth-bar.offsetWidth))+'px'; bar.style.top=Math.max(0,Math.min(r.top+dy,innerHeight-bar.offsetHeight))+'px'; bar.style.bottom='auto'; bar.style.transform='none'; };
  const up=()=>{ grip.removeEventListener('pointermove',mv); grip.removeEventListener('pointerup',up); };
  grip.addEventListener('pointermove',mv); grip.addEventListener('pointerup',up); });
})();
</script>
